<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ტექსტის მთარგმნელი</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .translator-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            flex: 1;
        }

        .swap-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .swap-btn:hover {
            background: #0056b3;
        }

        .text-areas {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .text-areas {
                flex-direction: row;
            }
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #007bff;
        }

        .translate-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .translate-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="translator-container">
    <h2>ტექსტის მთარგმნელი</h2>
    
    <div class="controls">
        <select id="fromLanguage">
            <option value="ka">ქართული</option>
            <option value="en" selected>ინგლისური</option>
            <option value="ru">რუსული</option>
            <option value="de">გერმანული</option>
            <option value="fr">ფრანგული</option>
            <option value="es">ესპანური</option>
        </select>

        <button class="swap-btn" onclick="swapLanguages()">⇄</button>

        <select id="toLanguage">
            <option value="ka" selected>ქართული</option>
            <option value="en">ინგლისური</option>
            <option value="ru">რუსული</option>
            <option value="de">გერმანული</option>
            <option value="fr">ფრანგული</option>
            <option value="es">ესპანური</option>
        </select>
    </div>

    <div class="text-areas">
        <textarea id="inputText" placeholder="ჩაწერეთ ტექსტი..."></textarea>
        <textarea id="outputText" placeholder="თარგმანი გამოჩნდება აქ..." readonly></textarea>
    </div>

    <button class="translate-btn" onclick="translateText()">თარგმნა</button>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const fromLang = document.getElementById('fromLanguage').value;
        const toLang = document.getElementById('toLanguage').value;
        const outputArea = document.getElementById('outputText');

        if (!text) {
            outputArea.value = '';
            return;
        }

        outputArea.value = "ითარგმნება...";

        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`);
            const data = await response.json();
            
            if (data.responseData) {
                outputArea.value = data.responseData.translatedText;
            } else {
                outputArea.value = "თარგმნა ვერ მოხერხდა.";
            }
        } catch (error) {
            console.error("Error:", error);
            outputArea.value = "შეცდომა: შეამოწმეთ ინტერნეტ კავშირი.";
        }
    }

    function swapLanguages() {
        const fromSelect = document.getElementById('fromLanguage');
        const toSelect = document.getElementById('toLanguage');
        
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;

        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        
        const tempText = inputText.value;
        inputText.value = outputText.value;
        outputText.value = tempText;
    }
</script>

</body>
</html>
