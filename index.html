<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 TikTok / Shorts Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ტიკტოკის კონტეინერი */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 600px) {
      .app-container {
        height: 92vh;
        border-radius: 20px;
        border: 2px solid #333;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
    }

    /* ვერტიკალური სქროლი Snap ეფექტით */
    .video-feed {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .video-feed::-webkit-scrollbar {
      display: none;
    }

    /* თითოეული ვიდეოს ბარათი */
    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: auto;
    }

    /* ინტერაქტიული ღილაკები მარჯვენა მხარეს */
    .side-bar {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.3rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, color 0.2s;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn span {
      font-size: 0.7rem;
      margin-top: 2px;
    }

    .action-btn.liked {
      color: #fe2c55;
      border-color: #fe2c55;
    }

    /* ინფო ზოლი */
    .video-info {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 75px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .video-info .username {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .video-info .description {
      font-size: 0.9rem;
      line-height: 1.3;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="video-feed">
      
      <!-- რეალური ვიდეო 1 -->
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&loop=1&rel=0&controls=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        
        <div class="side-bar">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>150K</span></button>
          <button class="action-btn">💬 <span>2.1K</span></button>
          <button class="action-btn">🔗 <span>გაზიარება</span></button>
        </div>

        <div class="video-info">
          <div class="username">@music_legend</div>
          <div class="description">ლეგენდარული ჰიტი 🔥 #classic #music #shorts</div>
        </div>
      </div>

      <!-- რეალური ვიდეო 2 -->
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/L_LUpnjgPso?autoplay=0&loop=1&rel=0&controls=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        
        <div class="side-bar">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>89K</span></button>
          <button class="action-btn">💬 <span>1.4K</span></button>
          <button class="action-btn">🔗 <span>გაზიარება</span></button>
        </div>

        <div class="video-info">
          <div class="username">@nature_world</div>
          <div class="description">ულამაზესი ხედები 4K ხარისხში 4K 🏔️ #nature #explore</div>
        </div>
      </div>

      <!-- რეალური ვიდეო 3 -->
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/jNQXAC9IVRw?autoplay=0&loop=1&rel=0&controls=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        
        <div class="side-bar">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>500K</span></button>
          <button class="action-btn">💬 <span>12K</span></button>
          <button class="action-btn">🔗 <span>გაზიარება</span></button>
        </div>

        <div class="video-info">
          <div class="username">@history_tech</div>
          <div class="description">პირველი ვიდეო YouTube-ის ისტორიაში 📽️ #history #youtube</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function toggleLike(btn) {
      btn.classList.toggle('liked');
    }
  </script>

</body>
</html>
