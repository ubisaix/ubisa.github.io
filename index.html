<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI საძიებო სისტემა</title>
    <style>
        /* სრულიად შიდა CSS - ინტერნეტი არ სჭირდება */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .badge {
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 15px;
        }

        main {
            width: 100%;
            max-width: 700px;
        }

        /* საძიებო ველის სტილი */
        .search-box {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }

        .search-box:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
        }

        .search-icon {
            font-size: 18px;
            margin-right: 12px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
        }

        input::placeholder {
            color: #64748b;
        }

        /* ფილტრის ღილაკები */
        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .cat-btn:hover {
            background: #334155;
        }

        .cat-btn.active {
            background: #6366f1;
            color: #ffffff;
            border-color: #6366f1;
        }

        /* მეტრიკა */
        .stats {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        /* შედეგების ბარათები */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }

        .card-category {
            font-size: 11px;
            text-transform: uppercase;
            color: #818cf8;
            font-weight: 600;
            margin-bottom: 6px;
            display: inline-block;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .card-desc {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            background: #0f172a;
            color: #64748b;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            background: #1e293b;
            border-radius: 12px;
            color: #94a3b8;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <span class="badge">✨ ჭკვიანი საძიებო სისტემა</span>
        <h1>რისი პოვნა გსურთ?</h1>
        <p class="subtitle">ჩაწერთ სიტყვა ქვემოთ მოცემულ ველში</p>
    </header>

    <main>
        <!-- საძიებო ველი -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="მაგალითად: თბილისი, პითონი, ხინკალი..." autocomplete="off">
        </div>

        <!-- ფილტრები -->
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('all', this)">ყველა</button>
            <button class="cat-btn" onclick="setCategory('geography', this)">გეოგრაფია</button>
            <button class="cat-btn" onclick="setCategory('tech', this)">ტექნოლოგიები</button>
            <button class="cat-btn" onclick="setCategory('food', this)">კულინარია</button>
        </div>

        <!-- სტატისტიკა -->
        <div class="stats">
            <span id="countText">მოიძებნა: 0</span>
            <span id="timeText">0ms</span>
        </div>

        <!-- შედეგები -->
        <div id="resultsList" class="results-list"></div>

        <!-- ცარიელი მდგომარეობა -->
        <div id="noResults" class="no-results">
            <h3>❌ შედეგი ვერ მოიძებნა</h3>
            <p style="font-size: 13px; margin-top: 5px;">სცადეთ სხვა საძიებო სიტყვა</p>
        </div>
    </main>

    <script>
        // მონაცემთა ბაზა
        const database = [
            {
                title: "თბილისი - საქართველოს დედაქალაქი",
                category: "geography",
                categoryName: "გეოგრაფია",
                desc: "თბილისი საქართველოს უდიდესი ქალაქი და დედაქალაქია. იგი მდებარეობს მტკვრის ხეობაში.",
                tags: ["თბილისი", "საქართველო", "ქალაქი"]
            },
            {
                title: "Python პროგრამირების ენა",
                category: "tech",
                categoryName: "ტექნოლოგიები",
                desc: "პითონი არის პოპულარული პროგრამირების ენა, რომელიც გამოიყენება AI-სა და ვებ-დეველოპმენტში.",
                tags: ["პითონი", "python", "კოდი"]
            },
            {
                title: "ქართული ხინკალი და ხაჭაპური",
                category: "food",
                categoryName: "კულინარია",
                desc: "ხინკალი და ხაჭაპური ტრადიციული ქართული კერძებია, რომლებიც ცნობილია მთელ მსოფლიოში.",
                tags: ["ხინკალი", "ხაჭაპური", "ჭამა"]
            },
            {
                title: "ბათუმი - ზღვისპირა ქალაქი",
                category: "geography",
                categoryName: "გეოგრაფია",
                desc: "ბათუმი აჭარის ავტონომიური რესპუბლიკის დედაქალაქია და შავი ზღვის სანაპიროზე მდებარეობს.",
                tags: ["ბათუმი", "ზღვა", "აჭარა"]
            },
            {
                title: "ხელოვნური ინტელექტი (AI)",
                category: "tech",
                categoryName: "ტექნოლოგიები",
                desc: "ხელოვნური ინტელექტი სწრაფად ვითარდება და იცვლის თანამედროვე ტექნოლოგიურ სამყაროს.",
                tags: ["ai", "ტექნოლოგია", "ინტელექტი"]
            }
        ];

        let currentCategory = 'all';

        function search() {
            const start = performance.now();
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsList = document.getElementById('resultsList');
            const noResults = document.getElementById('noResults');

            const filtered = database.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                if (!matchCat) return false;
                if (!query) return true;

                return item.title.toLowerCase().includes(query) ||
                       item.desc.toLowerCase().includes(query) ||
                       item.tags.some(t => t.toLowerCase().includes(query));
            });

            const end = performance.now();
            document.getElementById('timeText').textContent = `${(end - start).toFixed(1)}ms`;
            document.getElementById('countText').textContent = `მოიძებნა: ${filtered.length}`;

            resultsList.innerHTML = '';

            if (filtered.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="card-category">${item.categoryName}</span>
                    <div class="card-title">${item.title}</div>
                    <div class="card-desc">${item.desc}</div>
                    <div class="card-tags">
                        ${item.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                    </div>
                `;
                resultsList.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            search();
        }

        document.getElementById('searchInput').addEventListener('input', search);
        
        // პირველადი გაშვება
        search();
    </script>
</body>
</html>
