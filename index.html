<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ტექსტის მთარგმნელი</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .translator-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            flex: 1;
            cursor: pointer;
        }

        .swap-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .swap-btn:hover {
            background: #0056b3;
        }

        .text-areas {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 650px) {
            .text-areas {
                flex-direction: row;
            }
        }

        .input-box, .output-box {
            position: relative;
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            padding-bottom: 40px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #007bff;
        }

        /* ინსტრუმენტების ზოლი (ხმა, კოპირება, გასუფთავება) */
        .actions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            background: #e9ecef;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: #dee2e6;
        }

        .char-count {
            font-size: 12px;
            color: #777;
        }

        .translate-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .translate-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="translator-container">
    <h2>ტექსტის მთარგმნელი</h2>
    
    <div class="controls">
        <select id="fromLanguage">
            <option value="ka">ქართული (Georgian)</option>
            <option value="en" selected>ინგლისური (English)</option>
            <option value="ru">რუსული (Russian)</option>
            <option value="de">გერმანული (German)</option>
            <option value="fr">ფრანგული (French)</option>
            <option value="es">ესპანური (Spanish)</option>
            <option value="it">იტალიური (Italian)</option>
            <option value="tr">თურქული (Turkish)</option>
            <option value="uk">უკრაინული (Ukrainian)</option>
            <option value="zh">ჩინური (Chinese)</option>
            <option value="ja">იაპონური (Japanese)</option>
            <option value="ko">კორეული (Korean)</option>
            <option value="ar">არაბული (Arabic)</option>
            <option value="el">ბერძნული (Greek)</option>
            <option value="hy">სომხური (Armenian)</option>
            <option value="az">აზერბაიჯანული (Azerbaijani)</option>
            <option value="pl">პოლონური (Polish)</option>
            <option value="pt">პორტუგალიური (Portuguese)</option>
            <option value="nl">ჰოლანდიური (Dutch)</option>
            <option value="sv">შვედური (Swedish)</option>
            <option value="no">ნორვეგიული (Norwegian)</option>
            <option value="fi">ფინური (Finnish)</option>
            <option value="cs">ჩეხური (Czech)</option>
            <option value="hu">უნგრული (Hungarian)</option>
            <option value="ro">რუმინული (Romanian)</option>
            <option value="bg">ბულგარული (Bulgarian)</option>
            <option value="he">ებრაული (Hebrew)</option>
            <option value="hi">ინდური/ჰინდი (Hindi)</option>
            <option value="th">ტაილანდური (Thai)</option>
            <option value="vi">ვიეტნამური (Vietnamese)</option>
            <option value="id">ინდონეზიური (Indonesian)</option>
            <option value="fa">სპარსული (Persian)</option>
            <option value="da">დანიური (Danish)</option>
            <option value="sk">სლოვაკური (Slovak)</option>
            <option value="hr">ხორვატიული (Croatian)</option>
            <option value="sr">სერბული (Serbian)</option>
            <option value="lt">ლიეტუვური (Lithuanian)</option>
            <option value="lv">ლატვიური (Latvian)</option>
            <option value="et">ესტონური (Estonian)</option>
            <option value="la">ლათინური (Latin)</option>
        </select>

        <button class="swap-btn" onclick="swapLanguages()" title="ენების გაცვლა">⇄</button>

        <select id="toLanguage">
            <option value="ka" selected>ქართული (Georgian)</option>
            <option value="en">ინგლისური (English)</option>
            <option value="ru">რუსული (Russian)</option>
            <option value="de">გერმანული (German)</option>
            <option value="fr">ფრანგული (French)</option>
            <option value="es">ესპანური (Spanish)</option>
            <option value="it">იტალიური (Italian)</option>
            <option value="tr">თურქული (Turkish)</option>
            <option value="uk">უკრაინული (Ukrainian)</option>
            <option value="zh">ჩინური (Chinese)</option>
            <option value="ja">იაპონური (Japanese)</option>
            <option value="ko">კორეული (Korean)</option>
            <option value="ar">არაბული (Arabic)</option>
            <option value="el">ბერძნული (Greek)</option>
            <option value="hy">სომხური (Armenian)</option>
            <option value="az">აზერბაიჯანული (Azerbaijani)</option>
            <option value="pl">პოლონური (Polish)</option>
            <option value="pt">პორტუგალიური (Portuguese)</option>
            <option value="nl">ჰოლანდიური (Dutch)</option>
            <option value="sv">შვედური (Swedish)</option>
            <option value="no">ნორვეგიული (Norwegian)</option>
            <option value="fi">ფინური (Finnish)</option>
            <option value="cs">ჩეხური (Czech)</option>
            <option value="hu">უნგრული (Hungarian)</option>
            <option value="ro">რუმინული (Romanian)</option>
            <option value="bg">ბულგარული (Bulgarian)</option>
            <option value="he">ებრაული (Hebrew)</option>
            <option value="hi">ინდური/ჰინდი (Hindi)</option>
            <option value="th">ტაილანდური (Thai)</option>
            <option value="vi">ვიეტნამური (Vietnamese)</option>
            <option value="id">ინდონეზიური (Indonesian)</option>
            <option value="fa">სპარსული (Persian)</option>
            <option value="da">დანიური (Danish)</option>
            <option value="sk">სლოვაკური (Slovak)</option>
            <option value="hr">ხორვატიული (Croatian)</option>
            <option value="sr">სერბული (Serbian)</option>
            <option value="lt">ლიეტუვური (Lithuanian)</option>
            <option value="lv">ლატვიური (Latvian)</option>
            <option value="et">ესტონური (Estonian)</option>
            <option value="la">ლათინური (Latin)</option>
        </select>
    </div>

    <div class="text-areas">
        <div class="input-box">
            <textarea id="inputText" placeholder="ჩაწერეთ ტექსტი..." oninput="updateCharCount()"></textarea>
            <div class="actions">
                <div class="btn-group">
                    <button class="icon-btn" onclick="speakText('inputText', 'fromLanguage')" title="მოსმენა">🔊</button>
                    <button class="icon-btn" onclick="clearInput()" title="წაშლა">✕</button>
                </div>
                <span class="char-count" id="charCount">0/5000</span>
            </div>
        </div>

        <div class="output-box">
            <textarea id="outputText" placeholder="თარგმანი გამოჩნდება აქ..." readonly></textarea>
            <div class="actions">
                <div class="btn-group">
                    <button class="icon-btn" onclick="speakText('outputText', 'toLanguage')" title="მოსმენა">🔊</button>
                    <button class="icon-btn" onclick="copyToClipboard()" title="კოპირება">📋</button>
                </div>
            </div>
        </div>
    </div>

    <button class="translate-btn" onclick="translateText()">თარგმნა</button>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const fromLang = document.getElementById('fromLanguage').value;
        const toLang = document.getElementById('toLanguage').value;
        const outputArea = document.getElementById('outputText');

        if (!text) {
            outputArea.value = '';
            return;
        }

        outputArea.value = "ითარგმნება...";

        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${toLang}`);
            const data = await response.json();
            
            if (data.responseData) {
                outputArea.value = data.responseData.translatedText;
            } else {
                outputArea.value = "თარგმნა ვერ მოხერხდა.";
            }
        } catch (error) {
            console.error("Error:", error);
            outputArea.value = "შეცდომა: შეამოწმეთ ინტერნეტ კავშირი.";
        }
    }

    function swapLanguages() {
        const fromSelect = document.getElementById('fromLanguage');
        const toSelect = document.getElementById('toLanguage');
        
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;

        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        
        const tempText = inputText.value;
        inputText.value = outputText.value;
        outputText.value = tempText;

        updateCharCount();
    }

    // ტექსტის გაჟღერება (Text to Speech)
    function speakText(textareaId, langSelectId) {
        const text = document.getElementById(textareaId).value;
        const lang = document.getElementById(langSelectId).value;

        if (!text) return;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
    }

    // ტექსტის დაკოპირება
    function copyToClipboard() {
        const outputText = document.getElementById('outputText').value;
        if (outputText) {
            navigator.clipboard.writeText(outputText).then(() => {
                alert("თარგმანი დაკოპირდა!");
            });
        }
    }

    // ტექსტის წაშლა
    function clearInput() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateCharCount();
    }

    // სიმბოლოების დათვლა
    function updateCharCount() {
        const text = document.getElementById('inputText').value;
        document.getElementById('charCount').textContent = `${text.length}/5000`;
    }
</script>

</body>
</html>
