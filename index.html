<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 TikTok Style Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ტიკტოკის კონტეინერი */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #111;
      position: relative;
      overflow: hidden;
      border-radius: 0;
    }

    @media (min-width: 600px) {
      .app-container {
        height: 92vh;
        border-radius: 20px;
        border: 2px solid #333;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
    }

    /* ვერტიკალური სქროლი Snap ეფექტით */
    .video-feed {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
    }

    .video-feed::-webkit-scrollbar {
      display: none; /* Chrome, Safari */
    }

    /* თითოეული ვიდეოს ბლოკი */
    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* მარჯვენა ინტერაქტიული ღილაკები */
    .side-bar {
      position: absolute;
      right: 15px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.4);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: transform 0.2s;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn span {
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .action-btn.liked {
      color: #fe2c55;
    }

    /* ვიდეოს ქვედა ინფო (ავტორი და აღწერა) */
    .video-info {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 80px;
      z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .video-info .username {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .video-info .description {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #eee;
    }

    /* Mute / Unmute ინდიკატორი */
    .sound-notice {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sound-notice">🔊 დააჭირეთ ვიდეოს ხმის ჩასართავად</div>

    <div class="video-feed" id="videoFeed">
      
      <!-- ვიდეო 1 -->
      <div class="video-card">
        <video loop playsinline src="https://assets.mixkit.co/videos/preview/mixkit-tokyo-street-with-neon-lights-at-night-42232-large.mp4"></video>
        
        <div class="side-bar">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>12.5K</span></button>
          <button class="action-btn">💬 <span>432</span></button>
          <button class="action-btn">🔗 <span>გაზიარება</span></button>
        </div>

        <div class="video-info">
          <div class="username">@tokyo_vibes</div>
          <div class="description">ტაციური ღამე ტოკიოში 🏮✨ #tokyo #nightlife #japan</div>
        </div>
      </div>

      <!-- ვიდეო 2 -->
      <div class="video-card">
        <video loop playsinline src="https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-waterfall-in-a-forest-42898-large.mp4"></video>
        
        <div class="side-bar">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>8.9K</span></button>
          <button class="action-btn">💬 <span>120</span></button>
          <button class="action-btn">🔗 <span>გაზიარება</span></button>
        </div>

        <div class="video-info">
          <div class="username">@nature_geo</div>
          <div class="description">ბუნების სიმშვიდე 🌿💧 #nature #waterfall #peace</div>
        </div>
      </div>

      <!-- ვიდეო 3 -->
      <div class="video-card">
        <video loop playsinline src="https://assets.mixkit.co/videos/preview/mixkit-waves-in-the-water-1164-large.mp4"></video>
        
        <div class="side-bar">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>24.1K</span></button>
          <button class="action-btn">💬 <span>890</span></button>
          <button class="action-btn">🔗 <span>გაზიარება</span></button>
        </div>

        <div class="video-info">
          <div class="username">@ocean_life</div>
          <div class="description">ზღვის ტალღები 🌊 #ocean #relax #blue</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const videos = document.querySelectorAll('video');
    const feed = document.getElementById('videoFeed');

    // ავტომატური დაკვრა/პაუზა სქროლვისას (Intersection Observer)
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          video.play().catch(() => {
            // ბრაუზერები კრძალავენ ხმიან ავტო-Play-ს პირველი კლიკის გარეშე
            video.muted = true;
            video.play();
          });
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }, { threshold: 0.6 });

    videos.forEach(video => {
      observer.observe(video);

      // ვიდეოზე დაჭერით ხმის ჩართვა/გამორთვა ან პაუზა
      video.addEventListener('click', () => {
        if (video.muted) {
          video.muted = false;
        } else {
          if (video.paused) video.play();
          else video.pause();
        }
      });
    });

    // Like ღილაკის ფუნქცია
    function toggleLike(btn) {
      btn.classList.toggle('liked');
    }
  </script>

</body>
</html>
