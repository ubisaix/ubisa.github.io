<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Random Shorts Feed — Auto Play/Pause</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 600px) {
      .app-container {
        height: 92vh;
        border-radius: 20px;
        border: 2px solid #333;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
    }

    .video-feed {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .video-feed::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none; /* უზრუნველყოფს სქროლვის სიმარტივეს */
    }

    .side-bar {
      position: absolute;
      right: 12px;
      bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      z-index: 10;
    }

    .action-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.3rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, color 0.2s;
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .action-btn span {
      font-size: 0.7rem;
      margin-top: 2px;
    }

    .action-btn.liked {
      color: #fe2c55;
      border-color: #fe2c55;
    }

    .video-info {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 75px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .video-info .username {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
      color: #fff;
    }

    .video-info .description {
      font-size: 0.85rem;
      line-height: 1.3;
      color: #ddd;
    }

    .loading-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      color: #888;
      text-align: center;
      width: 80%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="video-feed" id="videoFeed">
      <div class="loading-msg" id="loadingMsg">🎲 YouTube Shorts იტვირთება...</div>
    </div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const videoFeed = document.getElementById('videoFeed');
    const loadingMsg = document.getElementById('loadingMsg');

    const RANDOM_SHORTS = [
      { id: "L_LUpnjgPso", author: "@nature_explore", desc: "ულამაზესი ბუნება 4K ხარისხში 🏔️ #shorts #nature" },
      { id: "dQw4w9WgXcQ", author: "@legend_music", desc: "ლეგენდარული ჰიტი 🔥 #music #viral" },
      { id: "jNQXAC9IVRw", author: "@history_tech", desc: "პირველი ვიდეო YouTube-ზე 📽️ #history" },
      { id: "tpe2A4Q9ETo", author: "@travel_vibes", desc: "მოგზაურობა მსოფლიოს გარშემო ✈️ #travel" },
      { id: "M576WGiDBdQ", author: "@tech_gadgets", desc: "მომავლის ტექნოლოგიები 🤖 #tech #future" },
      { id: "3JZ_D3ELwOQ", author: "@fitness_goals", desc: "ვარჯიში და ჯანსაღი ცხოვრება 💪 #fitness" },
      { id: "fJ9rUzIMcZQ", author: "@funny_moments", desc: "დღის იუმორი 😂 #comedy #shorts" },
      { id: "YykjpeuMNEk", author: "@speed_cars", desc: "სუპერქარები და სიჩქარე 🏎️ #cars #speed" }
    ];

    const players = {};

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // YouTube API მზადყოფნისას გაიშვება ავტომატურად
    function onYouTubeIframeAPIReady() {
      loadingMsg.remove();
      const shuffledVideos = shuffleArray([...RANDOM_SHORTS]);

      shuffledVideos.forEach((video, index) => {
        const randomLikes = (Math.random() * 80 + 10).toFixed(1) + 'K';
        const randomComments = Math.floor(Math.random() * 900 + 100);
        const iframeId = `player-${index}`;

        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.index = index;

        card.innerHTML = `
          <div id="${iframeId}"></div>
          
          <div class="side-bar">
            <button class="action-btn" onclick="toggleLike(this)">❤️ <span>${randomLikes}</span></button>
            <button class="action-btn">💬 <span>${randomComments}</span></button>
            <button class="action-btn">🔗 <span>გაზიარება</span></button>
          </div>

          <div class="video-info">
            <div class="username">${video.author}</div>
            <div class="description">${video.desc}</div>
          </div>
        `;

        videoFeed.appendChild(card);

        // YouTube პლეერის ინიციალიზაცია
        players[index] = new YT.Player(iframeId, {
          height: '100%',
          width: '100%',
          videoId: video.id,
          playerVars: {
            autoplay: 0,
            controls: 0,
            loop: 1,
            playlist: video.id,
            rel: 0,
            modestbranding: 1,
            playsinline: 1
          }
        });

        // Intersection Observer თითოეული ბარათისთვის
        observer.observe(card);
      });
    }

    // ჩასქროლვის კონტროლერი
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const index = entry.target.dataset.index;
        const player = players[index];

        if (player && typeof player.playVideo === 'function') {
          if (entry.isIntersecting) {
            // როცა ვიდეო ეკრანზე ჩნდება -> ირთვება
            player.playVideo();
          } else {
            // როცა სცდება ეკრანს -> პაუზდება
            player.pauseVideo();
          }
        }
      });
    }, { threshold: 0.7 });

    function toggleLike(btn) {
      btn.classList.toggle('liked');
    }
  </script>

</body>
</html>
