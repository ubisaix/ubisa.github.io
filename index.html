<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⏳ დროის კაფსულა — Wikipedia ისტორიული არქივი</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 2.3rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Time Machine Control Panel */
    .time-machine {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 650px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="date"] {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
    }

    .quick-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-quick {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      flex: 1;
      min-width: 90px;
      text-align: center;
    }

    .btn-quick:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Current Date Banner */
    .current-date-banner {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 25px;
      padding: 12px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 8px;
      border: 1px dashed var(--accent);
    }

    /* Tabs (Events, Births, Deaths) */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
    }

    /* Events List */
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;

      gap: 20px;
      align-items: flex-start;
      transition: transform 0.2s, border-color 0.2s;
    }

    .event-card:hover {
      transform: translateX(4px);
      border-color: var(--accent);
    }

    .event-year {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 8px;
      min-width: 80px;
      text-align: center;
    }

    .event-content {
      flex-grow: 1;
    }

    .event-text {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    .event-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .event-link:hover {
      text-decoration: underline;
    }

    .status-msg {
      text-align: center;
      padding: 50px;
      background: var(--card-bg);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⏳ დროის კაფსულა</h1>
      <p>Wikipedia-ს ისტორიული არქივი — ნახეთ, რა ხდებოდა მსოფლიოში ამ დღეს</p>
    </header>

    <!-- დროის მანქანის პანელი -->
    <div class="time-machine">
      <div class="controls-grid">
        <div class="control-group">
          <label>აირჩიეთ თარიღი:</label>
          <input type="date" id="datePicker" value="2008-08-08">
        </div>
        
        <div class="control-group">
          <label>სწრაფი გადასვლა:</label>
          <div class="quick-buttons">
            <button class="btn-quick" onclick="jumpYears(1)">1 წლის წინ</button>
            <button class="btn-quick" onclick="jumpYears(5)">5 წლის წინ</button>
            <button class="btn-quick" onclick="jumpYears(10)">10 წლის წინ</button>
            <button class="btn-quick" onclick="setDate('1991-04-09')">9 აპრილი</button>
          </div>
        </div>
      </div>
    </div>

    <!-- არჩეული თარიღის ბანერი -->
    <div class="current-date-banner" id="currentDateDisplay">
      📅 8 აგვისტოს ისტორიული მოვლენები
    </div>

    <!-- ტაბები -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('selected')">📜 მთავარი მოვლენები</button>
      <button class="tab-btn" onclick="switchTab('births')">👶 დაბადებულები</button>
      <button class="tab-btn" onclick="switchTab('deaths')">🕊️ გარდაცვლილები</button>
    </div>

    <!-- კონტენტის ზონა -->
    <div id="eventsContainer" class="events-list">
      <div class="status-msg">მონაცემები იტვირთება Wikipedia-დან...</div>
    </div>
  </div>

  <script>
    let wikiData = null;
    let currentTab = 'selected';

    const datePicker = document.getElementById('datePicker');
    const currentDateDisplay = document.getElementById('currentDateDisplay');
    const eventsContainer = document.getElementById('eventsContainer');

    // ინიციალიზაცია
    function init() {
      fetchWikiEvents();

      datePicker.addEventListener('change', () => {
        fetchWikiEvents();
      });
    }

    // Wikipedia-ს API-დან მონაცემების წამოღება
    async function fetchWikiEvents() {
      const selectedDate = new Date(datePicker.value);
      if (isNaN(selectedDate)) return;

      const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const day = String(selectedDate.getDate()).padStart(2, '0');

      // ქართული დასახელება ბანერისთვის
      const formattedDateKa = selectedDate.toLocaleDateString('ka-GE', { day: 'numeric', month: 'long' });
      currentDateDisplay.textContent = `📅 ${formattedDateKa}-ს ისტორიული არქივი`;

      eventsContainer.innerHTML = '<div class="status-msg">მონაცემები იტვირთება Wikipedia-დან...</div>';

      try {
        // Wikipedia-ს ოფიციალური On-This-Day API
        const response = await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/all/${month}/${day}`);
        
        if (!response.ok) throw new Error("API-ს შეცდომა");

        wikiData = await response.json();
        renderTabContent();

      } catch (error) {
        console.error("შეცდომა Wikipedia API-სთან:", error);
        eventsContainer.innerHTML = '<div class="status-msg">❌ მონაცემების წამოღება ვერ მოხერხდა. შეამოწმეთ ინტერნეტ კავშირი.</div>';
      }
    }

    // ტაბების გადართვა
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderTabContent();
    }

    // ტაბის მიხედვით კონტენტის გამოტანა
    function renderTabContent() {
      if (!wikiData) return;

      const items = wikiData[currentTab] || [];

      if (items.length === 0) {
        eventsContainer.innerHTML = '<div class="status-msg">ამ კატეგორიაში ჩანაწერები ვერ მოიძებნა.</div>';
        return;
      }

      eventsContainer.innerHTML = items.slice(0, 20).map(item => {
        const year = item.year || "ისტორია";
        const text = item.text;
        const wikiUrl = item.pages && item.pages[0] ? item.pages[0].content_urls.desktop.page : null;

        return `
          <div class="event-card">
            <div class="event-year">${year}</div>
            <div class="event-content">
              <p class="event-text">${text}</p>
              ${wikiUrl ? `<a href="${wikiUrl}" target="_blank" class="event-link">ვრცლად Wikipedia-ზე →</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // სწრაფი გადასვლები
    function setDate(dateStr) {
      datePicker.value = dateStr;
      fetchWikiEvents();
    }

    function jumpYears(yearsAgo) {
      const today = new Date();
      const targetYear = today.getFullYear() - yearsAgo;
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      
      setDate(`${targetYear}-${month}-${day}`);
    }

    init();
  </script>
</body>
</html>
