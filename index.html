<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⏳ დროის კაფსულა — ქართული ვიკიპედიის არქივი</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 2.3rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .time-machine {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="date"] {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
    }

    .quick-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-quick {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      flex: 1;
      min-width: 90px;
      text-align: center;
    }

    .btn-quick:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    .current-date-banner {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 25px;
      padding: 12px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 8px;
      border: 1px dashed var(--accent);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .event-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      gap: 15px;
      align-items: flex-start;
      transition: transform 0.2s, border-color 0.2s;
    }

    .event-card:hover {
      transform: translateX(4px);
      border-color: var(--accent);
    }

    .event-content {
      flex-grow: 1;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .event-content a {
      color: #60a5fa;
      text-decoration: none;
    }

    .event-content a:hover {
      text-decoration: underline;
    }

    .status-msg {
      text-align: center;
      padding: 50px;
      background: var(--card-bg);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>⏳ დროის კაფსულა</h1>
      <p>ქართული ვიკიპედიის ისტორიული არქივი — რა ხდებოდა ამ დღეს?</p>
    </header>

    <div class="time-machine">
      <div class="controls-grid">
        <div class="control-group">
          <label>აირჩიეთ თარიღი:</label>
          <input type="date" id="datePicker">
        </div>
        
        <div class="control-group">
          <label>სწრაფი გადასვლა:</label>
          <div class="quick-buttons">
            <button class="btn-quick" onclick="jumpYears(1)">1 წლის წინ</button>
            <button class="btn-quick" onclick="jumpYears(2)">2 წლის წინ</button>
            <button class="btn-quick" onclick="jumpYears(3)">3 წლის წინ</button>
            <button class="btn-quick" onclick="jumpYears(5)">5 წლის წინ</button>
          </div>
        </div>
      </div>
    </div>

    <div class="current-date-banner" id="currentDateDisplay">
      📅 ისტორიული არქივი
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('events', this)">📜 მოვლენები</button>
      <button class="tab-btn" onclick="switchTab('births', this)">👶 დაიბადნენ</button>
      <button class="tab-btn" onclick="switchTab('deaths', this)">🕊️ გარდაიცვალნენ</button>
    </div>

    <div id="eventsContainer" class="events-list">
