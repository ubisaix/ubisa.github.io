<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სამშენებლო მასალების კალკულატორი</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
            padding: 28px;
        }

        .header {
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h2 {
            color: #1a252f;
            font-size: 22px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #3182ce;
        }

        .results-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }

        .results-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 14px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 14px;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #64748b;
        }

        .result-value {
            font-weight: 600;
            color: #0f172a;
        }

        .total-row {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #cbd5e0;
            background: #ebf8ff;
            padding: 12px;
            border-radius: 6px;
        }

        .total-row .result-label {
            color: #2b6cb0;
            font-weight: 700;
        }

        .total-row .result-value {
            color: #2b6cb0;
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h2>სამშენებლო ბლოკისა და ხარჯების კალკულატორი</h2>
        <p>გაიანგარიშეთ კედლის ფართობი, ბლოკების რაოდენობა და სავარაუდო ბიუჯეტი</p>
    </div>

    <div class="form-grid">
        <div class="input-group">
            <label for="wallLength">კედლის სიგრძე (მეტრი)</label>
            <input type="number" id="wallLength" value="10" min="0" step="0.1" oninput="calculate()">
        </div>

        <div class="input-group">
            <label for="wallHeight">კედლის სიმაღლე (მეტრი)</label>
            <input type="number" id="wallHeight" value="3" min="0" step="0.1" oninput="calculate()">
        </div>

        <div class="input-group">
            <label for="blockPrice">ბლოკის ფასი (₾ / ცალი)</label>
            <input type="number" id="blockPrice" value="2.5" min="0" step="0.1" oninput="calculate()">
        </div>

        <div class="input-group">
            <label for="cementPrice">ცემენტის ფასი (₾ / ტომარა)</label>
            <input type="number" id="cementPrice" value="16" min="0" step="0.5" oninput="calculate()">
        </div>
    </div>

    <div class="results-container">
        <div class="results-title">გაანგარიშების შედეგი</div>

        <div class="result-row">
            <span class="result-label">კედლის ფართობი:</span>
            <span class="result-value" id="areaResult">30.00 მ²</span>
        </div>

        <div class="result-row">
            <span class="result-label">საჭირო ბლოკი (20x20x40 სმ):</span>
            <span class="result-value" id="blocksResult">375 ცალი</span>
        </div>

        <div class="result-row">
            <span class="result-label">ცემენტის სავარაუდო ხარჯი:</span>
            <span class="result-value" id="cementResult">5 ტომარა</span>
        </div>

        <div class="result-row total-row">
            <span class="result-label">სავარაუდო ჯამური ღირებულება:</span>
            <span class="result-value" id="totalCostResult">1,017.50 ₾</span>
        </div>
    </div>
</div>

<script>
    function calculate() {
        // მონაცემების წამოღება
        const length = parseFloat(document.getElementById('wallLength').value) || 0;
        const height = parseFloat(document.getElementById('wallHeight').value) || 0;
        const blockPrice = parseFloat(document.getElementById('blockPrice').value) || 0;
        const cementPrice = parseFloat(document.getElementById('cementPrice').value) || 0;

        // 1. ფართობის დაანგარიშება
        const area = length * height;

        // 2. ბლოკების რაოდენობა (სტანდარტულად 12.5 ბლოკი 1 კვ.მ-ზე)
        const totalBlocks = Math.ceil(area * 12.5);

        // 3. ცემენტის ტომრები (სავარაუდოდ 1 ტომარა ყოველ 75 ბლოკზე)
        const totalCementBags = Math.ceil(totalBlocks / 75);

        // 4. ჯამური ღირებულება
        const blockCost = totalBlocks * blockPrice;
        const cementCost = totalCementBags * cementPrice;
        const totalCost = blockCost + cementCost;

        // შედეგების გამოჩენა
        document.getElementById('areaResult').innerText = area.toFixed(2) + ' მ²';
        document.getElementById('blocksResult').innerText = totalBlocks.toLocaleString('ka-GE') + ' ცალი';
        document.getElementById('cementResult').innerText = totalCementBags + ' ტომარა';
        document.getElementById('totalCostResult').innerText = totalCost.toLocaleString('ka-GE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₾';
    }

    // პირველადი გაანგარიშება ჩატვირთვისას
    calculate();
</script>

</body>
</html>
