<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⏳ დროის კაფსულა — ისტორიული ამბები</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Time Machine Control Panel */
    .time-machine {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 600px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="date"] {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
    }

    /* Quick Jump Buttons */
    .quick-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-quick {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      flex: 1;
      min-width: 100px;
      text-align: center;
    }

    .btn-quick:hover, .btn-quick.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* Slider Container */
    .slider-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Date Display Banner */
    .current-date-banner {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 30px;
      padding: 12px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 8px;
      border: 1px dashed var(--accent);
    }

    /* News Feed Grid */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.4);
      border-color: var(--accent);
    }

    .news-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #0f172a;
    }

    .news-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .news-badge {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge-geo { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-world { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
    .badge-tech { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

    .news-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .news-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .empty-state h3 {
      font-size: 1.3rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

    <!-- დროის მანქანის პანელი -->

    <!-- არჩეული თარიღის ბანერი -->
    <div class="current-date-banner" id="currentDateDisplay">

    <div class="news-grid" id="newsGrid">

    </div>
  </div>

    // DOM ელემენტები

    const sliderYearVal = document.getElementById('sliderYearVal');
    const currentDateDisplay = document.getElementById('currentDateDisplay');
    const newsGrid = document.getElementById('newsGrid');

    function init() {
      updateDisplay();

      datePicker.addEventListener('change', (e) => {
        const selectedDate = new Date(e.target.value);
        if (!isNaN(selectedDate)) {
          yearSlider.value = selectedDate.getFullYear();
          sliderYearVal.textContent = selectedDate.getFullYear();
          updateDisplay();
        }
      });

      yearSlider.addEventListener('input', (e) => {
        const year = e.target.value;
        sliderYearVal.textContent = year;
        
        // თარიღის შენარჩუნება, მხოლოდ წლის შეცვლა
